services:
  - type: web
    name: vertech-tdf-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: COPERNICUS_USER
        sync: false
      - key: COPERNICUS_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
